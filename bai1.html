<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Giới thiệu cá nhân</title>
	<style>
		* {
			box-sizing: border-box;
            font-family: Arial, sans-serif;
		}

		body {
			display: flex;
			flex-direction: column;
			min-height: 100vh;
			margin: 0;
			color: #243447;
			background: #eef5f2;
			transition: background-color 0.3s ease, color 0.3s ease;
		}

		body.dark-mode {
			color: #f4f6f8;
			background: #1d2130;
		}

		header {
			padding: 14px 8%;
			color: #ffffff;
			background: #6a628b;
			text-align: center;
		}

		nav {
			display: flex;
			justify-content: center;
			gap: 24px;
			padding: 14px 8%;
			background: #265061;
		}

		nav a {
			color: #ffffff;
			font-weight: 700;
			text-decoration: none;
		}

		nav a:hover {
			color: #eba31d;
		}

		main {
			flex: 1;
			width: 900px;
			margin: 40px auto;
		}

		.intro {
			display: grid;
			grid-template-columns: 1.1fr 1fr;
			gap: 28px;
			align-items: center;
			padding: 32px;
			border: 1px solid #d5e1dc;
			border-radius: 1px;
			background: #ffffff;
			transition: background-color 0.3s ease;
		}

		.dark-mode .intro {
			background: #292e40;
		}

		.intro h2 {
			margin-top: 0;
			color: #267c99;
		}

		.dark-mode .intro h2 {
			color: #f7c873;
		}

		.greeting {
			min-height: 28px;
			color: #c26722;
			font-size: 1.1rem;
			font-weight: 700;
		}

		.profile-box {
			padding: 24px;
			border-left: 5px solid #f7c873;
			background: #f4f8f5;
			transition: background-color 0.3s ease;
		}

		.dark-mode .profile-box {
			background: #353b50;
		}

		.profile-box p {
			margin: 10px 0;
		}

		.clock {
			grid-column: 1 / -1;
			margin: 0;
			padding-top: 18px;
			border-top: 1px solid #d5e1dc;
			color: #176b87;
			font-size: 1.15rem;
			font-weight: 700;
			text-align: center;
		}

		.dark-mode .clock {
			color: #f7c873;
		}

		.theme-toggle {
			position: fixed;
			top: 18px;
			right: 24px;
			z-index: 10;
			display: grid;
			place-items: center;
			width: 42px;
			height: 42px;
			border-radius: 50%;
			color: #ffffff;
			background: #f2bd18;
			cursor: pointer;
			font-size: 1.3rem;
			transition: transform 0.2s ease, background-color 0.3s ease;
		}

		.theme-toggle:hover {
			transform: scale(1.08);
		}

		.dark-mode .theme-toggle {
			background: #34384b;
		}

		footer {
			padding: 22px 8%;
			color: #ffffff;
			background: #243447;
			text-align: center;
		}

		footer p {
			margin: 0;
		}

	</style>
</head>
<body>
	<header id="trang-dau">
		<h1>Giới thiệu bản thân</h1>
	</header>

	<nav aria-label="Điều hướng chính">
		<a href="#trang-dau">Trang đầu</a>
		<a href="#gioi-thieu">Giới thiệu</a>
		<a href="#lien-he">Liên hệ</a>
	</nav>

	<main id="gioi-thieu">
		<section class="intro">
			<div>
				<h2>Giới thiệu bản thân</h2>
				<p id="loi-chao" class="greeting"></p>
			</div>

			<div class="profile-box">
				<p><strong>Họ tên:</strong> Nguyễn Đình Lâm Đức</p>
				<p><strong>Sở thích:</strong> Lập trình, tìm tòi và khám phá công nghệ mới.</p>
				<p><strong>Mục tiêu:</strong> Trở thành một lập trình viên giỏi.</p>
			</div>

			<p id="gio-hien-tai" class="clock"></p>
		</section>
	</main>
	<button id="doi-mau" class="theme-toggle" type="button" aria-label="Chuyển sang chế độ tối" title="Chuyển chế độ sáng/tối">☀</button>

	<footer id="lien-he">
		<p>&copy; 2026 Nguyễn Đình Lâm Đức</p>
	</footer>

	<script>
		const greeting = document.getElementById("loi-chao");
		const currentTime = document.getElementById("gio-hien-tai");
		const changeColorButton = document.getElementById("doi-mau");
		const currentHour = new Date().getHours();

		function displayCurrentTime() {
			const now = new Date();
			const time = now.toLocaleTimeString("vi-VN", {
				hour: "2-digit",
				minute: "2-digit",
				second: "2-digit"
			});

			currentTime.innerText = `Giờ hiện tại: ${time}`;
		}

		displayCurrentTime();
		setInterval(displayCurrentTime, 1000);

		if (currentHour < 12) {
			greeting.innerText = "Chào buổi sáng! Chúc bạn một ngày học tập hiệu quả.";
		} else if (currentHour < 18) {
			greeting.innerText = "Chào buổi chiều! Chúc bạn buổi chiều vui vẻ.";
		} else {
			greeting.innerText = "Chào buổi tối! Chúc bạn buổi tối vui vẻ.";
		}

		changeColorButton.addEventListener("click", function () {
			document.body.classList.toggle("dark-mode");
			const isDarkMode = document.body.classList.contains("dark-mode");

			changeColorButton.innerText = isDarkMode ? "☾" : "☀";
			changeColorButton.setAttribute(
				"aria-label",
				isDarkMode ? "Chuyển sang chế độ sáng" : "Chuyển sang chế độ tối"
			);
		});
	</script>
</body>
</html>
